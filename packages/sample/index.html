<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tilawa SDK sample</title>
    <style>
      body { font: 15px/1.45 system-ui, sans-serif; margin: 12px; max-width: 760px; }
      fieldset { border: 1px solid #ddd; margin: 8px 0; }
      label { margin-right: 12px; white-space: nowrap; }
      input[type="number"] { width: 4.5em; }
      button, select, input { font: inherit; padding: 4px 8px; }
      #passage { direction: rtl; font: 26px/2 "Amiri", "Noto Naskh Arabic", serif; padding: 8px; background: #fbfaf6; min-height: 2em; }
      #passage span { padding: 0 2px; border-radius: 4px; }
      .at { background: #cfe7ff; }
      .suspected { background: #ffe8a3; }
      .confirmed { background: #ffb3b3; }
      .resolved { background: #d6f5d6; }
      .uncertain { background: #e6e6e6; }
      .hidden { color: transparent; text-shadow: 0 0 9px #999; }
      #meter { height: 6px; background: #4caf50; width: 0; transition: width 60ms; }
      #status { color: #555; }
      #log { font: 12px/1.35 ui-monospace, monospace; background: #f4f4f4; padding: 8px; max-height: 40vh; overflow: auto; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h2>Tilawa SDK sample</h2>
    <fieldset>
      <legend>Model</legend>
      <label>Provider <select id="provider"><option value="wasm">WASM SIMD</option><option value="webgpu,wasm">WebGPU → WASM</option></select></label>
      <label>Threads <select id="threads"><option>1</option><option>2</option><option>4</option></select></label>
      <button id="load">Load model</button>
      <p id="model-note"></p>
    </fieldset>
    <fieldset>
      <legend>Session</legend>
      <label><input type="radio" name="mode" value="memorization" checked /> Memorization</label>
      <label><input type="radio" name="mode" value="free" /> Free recitation</label><br />
      <label>Surah <input id="surah" type="number" min="1" max="114" value="1" /></label>
      <label>From <input id="from" type="number" min="1" value="1" /></label>
      <label>To <input id="to" type="number" min="1" value="7" /></label><br />
      <label><input id="selfcorr" type="checkbox" /> Count self-corrections as mistakes</label>
      <label><input id="hide" type="checkbox" checked /> Hide text until recited</label>
      <label>Confirm after <select id="confirm"><option value="2500">2.5 s</option><option value="1500">1.5 s</option><option value="next">next word</option></select></label>
    </fieldset>
    <button id="mic" disabled>Start microphone</button>
    <label>or a WAV file <input id="file" type="file" accept="audio/wav,.wav" disabled /></label>
    <button id="copy">Copy log JSON</button>
    <div id="meter"></div>
    <p id="status">Load the model first.</p>
    <div id="passage"></div>
    <h3>Mistakes</h3>
    <ul id="mistakes"></ul>
    <details><summary>Event log</summary><div id="log"></div></details>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
