<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>@tilawa/core — minimal browser example</title>
<link rel="icon" href="data:," />
<!--
  No bundler. Serve the repo root and open this page:
    python3 -m http.server 8000
    open http://localhost:8000/packages/core/examples/browser/
  Needs `npm run build` in packages/core, plus the demo assets under
  web/frontend/public (model, corpus, quran.json). Override with ?assets=<base-url>.
-->
<script type="importmap">
{
  "imports": {
    "@tilawa/core": "/packages/core/dist/index.js",
    "onnxruntime-web": "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.24.2/dist/ort.wasm.bundle.min.mjs"
  }
}
</script>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
  button, input { font: inherit; margin-right: .5rem; }
  #status { color: #666; }
  #verses li { margin: .5rem 0; }
  .ar { font-size: 1.4rem; direction: rtl; display: block; }
  #log { font: 12px/1.4 ui-monospace, monospace; background: #f5f5f5; padding: .5rem; max-height: 260px; overflow: auto; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>@tilawa/core</h1>
<p id="status">Loading…</p>
<p>
  <button id="mic" disabled>Start mic</button>
  <input id="file" type="file" accept="audio/*" disabled />
  <button id="reset" disabled>Reset</button>
</p>
<p>Candidate: <strong id="candidate">—</strong></p>
<p>Final: <strong id="final">—</strong></p>
<ol id="verses"></ol>
<pre id="log"></pre>

<script type="module">
import * as ort from "onnxruntime-web";
import { createRecognitionSession } from "@tilawa/core";

const ASSETS = new URLSearchParams(location.search).get("assets") ?? "/web/frontend/public/";
const SAMPLE_RATE = 16000;
const CHUNK = 4800; // 300 ms, same cadence as the demo worklet

const $ = (id) => document.getElementById(id);
const setStatus = (s) => ($("status").textContent = s);
const log = (s) => { $("log").textContent += s + "\n"; $("log").scrollTop = 1e9; };
const get = (path) => fetch(ASSETS + path).then((r) => {
  if (!r.ok) throw new Error(`${path}: ${r.status}`);
  return r;
});
addEventListener("error", (e) => setStatus(`Error: ${e.message}`));

// The app's job: wire up ort + fetch assets. Everything else is the SDK.
ort.env.wasm.numThreads = 1;
ort.env.wasm.simd = true;

setStatus("Fetching model + corpus…");
const t0 = performance.now();
const [model, corpus, quran] = await Promise.all([
  get("models/zipformer_a0w_ep1_a05.int8.onnx").then((r) => r.arrayBuffer()),
  get("zipformer_quran.json").then((r) => r.json()),
  get("quran.json").then((r) => r.json()),
]);

const session = await createRecognitionSession({
  ort,
  model,
  corpus,
  quran,
  onEvent: render,
});
setStatus(`Ready in ${Math.round(performance.now() - t0)} ms (engine: ${session.engine})`);
for (const id of ["mic", "file", "reset"]) $(id).disabled = false;

function render(msg) {
  switch (msg.type) {
    case "verse_match": {
      const li = document.createElement("li");
      li.innerHTML = `<b>${msg.surah}:${msg.ayah}</b> ${msg.surah_name} (${msg.confidence.toFixed(2)})<span class="ar"></span>`;
      li.querySelector(".ar").textContent = msg.verse_text;
      $("verses").append(li);
      log(`verse_match ${msg.surah}:${msg.ayah} conf=${msg.confidence.toFixed(3)}`);
      break;
    }
    case "verse_candidate": {
      const c = msg.candidates[0];
      $("candidate").textContent = c ? `${c.surah}:${c.ayah} (${c.confidence.toFixed(2)}${msg.stable ? ", stable" : ""})` : "—";
      break;
    }
    case "final_sequence":
      $("final").textContent = msg.verses.map((v) => `${v.surah}:${v.ayah}`).join(", ") || "(none)";
      log(`final_sequence [${$("final").textContent}]`);
      break;
    case "raw_transcript":
    case "word_progress":
      break;
    default:
      log(msg.type);
  }
}

// ZipformerSession is stateful: feed/stop/reset must never overlap.
let queue = Promise.resolve();
const enqueue = (fn) => (queue = queue.then(fn).catch((e) => { log(`error: ${e.message}`); console.error(e); }));

function resetUi() {
  $("verses").replaceChildren();
  $("candidate").textContent = "—";
  $("final").textContent = "—";
}
$("reset").onclick = () => enqueue(() => { session.reset(); resetUi(); });

// --- File: decode, resample to 16 kHz mono, stream in 300 ms chunks, then stop().
async function decodeTo16k(buf) {
  const decoded = await new AudioContext().decodeAudioData(buf);
  const off = new OfflineAudioContext(1, Math.ceil(decoded.duration * SAMPLE_RATE), SAMPLE_RATE);
  const src = off.createBufferSource();
  src.buffer = decoded;
  src.connect(off.destination);
  src.start();
  return (await off.startRendering()).getChannelData(0);
}

$("file").onchange = (e) => enqueue(async () => {
  const f = e.target.files[0];
  if (!f) return;
  session.reset();
  resetUi();
  try {
    const pcm = await decodeTo16k(await f.arrayBuffer());
    setStatus(`Recognizing ${f.name} (${(pcm.length / SAMPLE_RATE).toFixed(1)} s)…`);
    const t = performance.now();
    for (let i = 0; i < pcm.length; i += CHUNK) await session.feed(pcm.subarray(i, i + CHUNK));
    await session.stop();
    setStatus(`Done: ${f.name} in ${Math.round(performance.now() - t)} ms`);
  } catch (err) {
    setStatus(`Error: ${f.name}: ${err.message}`);
    throw err;
  } finally {
    document.body.dataset.done = "1";
  }
});

// --- Mic: the demo's worklet resamples to 16 kHz and posts 300 ms Float32 chunks.
let mic = null;
$("mic").onclick = async () => {
  if (mic) {
    mic.stream.getTracks().forEach((t) => t.stop());
    await mic.ctx.close();
    mic = null;
    $("mic").textContent = "Start mic";
    enqueue(() => session.stop());
    return;
  }
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: false, noiseSuppression: false, autoGainControl: false },
  });
  const ctx = new AudioContext();
  await ctx.audioWorklet.addModule(ASSETS + "audio-processor.js");
  const node = new AudioWorkletNode(ctx, "audio-stream-processor");
  node.port.onmessage = (e) => enqueue(() => session.feed(new Float32Array(e.data)));
  ctx.createMediaStreamSource(stream).connect(node);
  enqueue(() => { session.reset(); resetUi(); });
  mic = { stream, ctx };
  $("mic").textContent = "Stop mic";
};
</script>
</body>
</html>
