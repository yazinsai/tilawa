<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Record · Tilawa lab</title>
    <link rel="preload" href="/static/fonts/onest-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/static/fonts/amiri-quran-arabic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/static/lab.css" />
    <style>
      .rec-text [data-plant] { cursor: help; border-radius: 4px; }
      .rec-text [data-plant]:focus-visible { outline: 2px solid var(--gold-600); outline-offset: 2px; }
      .rec-tip { position: fixed; z-index: 50; max-width: 340px; display: flex; gap: var(--s2); align-items: flex-start; padding: var(--s2) var(--s3); border-radius: var(--radius); background: var(--g-900); color: #fff; font: 400 var(--t-sm) / 1.5 'Onest', system-ui, sans-serif; box-shadow: 0 8px 24px rgb(0 0 0 / 0.18); pointer-events: none; }
      .rec-tip .li-ar { font-size: 22px; line-height: 1.6; }
      .rec-tip .rec-step { flex: none; color: #f3d48a; margin-top: 2px; }
    </style>
  </head>
  <body>
    <header class="top"><div class="top-in" id="head"></div></header>
    <main><div class="narrow" id="main"><p class="rv-head muted">Loading…</p></div></main>
    <div class="rec-dock" id="dock" hidden></div>
    <script type="module" src="/static/record.js"></script>
  </body>
</html>
