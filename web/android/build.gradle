// Android build of the web demo: one WebView over ../frontend/dist, models included, no network access.
// Build the demo first (npm run build && npm run assets:v1, see AGENTS.md), then: ./gradlew assembleDebug
// (assembleRelease for a signed APK, bundleRelease for the Play Store bundle)
plugins { id 'com.android.application' version '8.13.0' }

// The release key is named in ~/.gradle/gradle.properties (TILAWA_STORE_FILE, TILAWA_STORE_PASSWORD,
// TILAWA_KEY_ALIAS), never in the repo. Without it assembleRelease leaves the APK unsigned.
def releaseStore = findProperty('TILAWA_STORE_FILE')

android {
    namespace 'dev.tilawa.demo'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.tilawa.demo'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '1.0.0-rc.1'
    }
    sourceSets.main.assets.srcDirs = ['../frontend/dist']
    // A compressed asset is inflated into memory in one piece; the model is 68 MB.
    androidResources { noCompress 'onnx', 'wasm' }
    if (releaseStore) {
        signingConfigs {
            release {
                storeFile file(releaseStore)
                storePassword findProperty('TILAWA_STORE_PASSWORD')
                keyAlias findProperty('TILAWA_KEY_ALIAS')
                keyPassword findProperty('TILAWA_STORE_PASSWORD')
            }
        }
        buildTypes.release.signingConfig = signingConfigs.release
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

preBuild.doFirst {
    assert file('../frontend/dist/v1/manifest.json').exists() : 'web/frontend/dist/v1 is missing: run npm run build and npm run assets:v1 in web/frontend'
}
