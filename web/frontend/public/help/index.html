<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tilawa — Help improve recitation</title>
  <meta name="description" content="Record short Quran recitations with a deliberate mistake. Each recording helps an offline app learn to catch skipped words, wrong harakat and tajweed slips." />
  <meta property="og:title" content="Help Tilawa learn to catch recitation mistakes" />
  <meta property="og:description" content="Read a short ayah, make the mistake we ask for, submit. Takes 20 seconds per recording." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <header>
      <div class="topbar">
        <p class="eyebrow" data-i18n="eyebrow"></p>
        <button id="lang" class="lang" lang="ar" data-i18n="toggle"></button>
      </div>
      <h1 data-i18n="h1"></h1>
      <p class="lede" data-i18n-html="lede"></p>
    </header>

    <section id="intro" class="card">
      <div class="how-it-works">
        <div><svg class="icon" aria-hidden="true"><use href="icons.svg#book-2-linear" /></svg><span data-i18n="stepRead"></span></div>
        <div><svg class="icon" aria-hidden="true"><use href="icons.svg#microphone-3-linear" /></svg><span data-i18n="stepRecord"></span></div>
        <div><svg class="icon" aria-hidden="true"><use href="icons.svg#check-circle-linear" /></svg><span data-i18n="stepSend"></span></div>
      </div>
      <p class="quiet-tip" data-i18n="note1"></p>
      <details class="profile">
        <summary><svg class="icon" aria-hidden="true"><use href="icons.svg#settings-linear" /></svg><span data-i18n="details"></span></summary>
        <div class="fields">
          <label><span data-i18n="device"></span>
            <select id="device">
              <option value="phone" data-i18n="device.phone"></option>
              <option value="laptop" data-i18n="device.laptop"></option>
              <option value="desktop" data-i18n="device.desktop"></option>
              <option value="tablet" data-i18n="device.tablet"></option>
              <option value="headset" data-i18n="device.headset"></option>
              <option value="other" data-i18n="device.other"></option>
            </select>
          </label>
          <label><span><span data-i18n="voice"></span> <span class="opt" data-i18n="optional"></span></span>
            <select id="gender">
              <option value="" data-i18n="na"></option>
              <option value="male" data-i18n="gender.male"></option>
              <option value="female" data-i18n="gender.female"></option>
            </select>
          </label>
          <label><span><span data-i18n="level"></span> <span class="opt" data-i18n="optional"></span></span>
            <select id="level">
              <option value="" data-i18n="na"></option>
              <option value="beginner" data-i18n="level.beginner"></option>
              <option value="intermediate" data-i18n="level.intermediate"></option>
              <option value="hafiz" data-i18n="level.hafiz"></option>
            </select>
          </label>
        </div>
      </details>
      <label class="consent">
        <input type="checkbox" id="consent" />
        <span data-i18n-html="consent"></span>
      </label>
      <button id="start" class="primary" disabled><span data-i18n="start"></span><svg class="icon directional" aria-hidden="true"><use href="icons.svg#arrow-right-linear" /></svg></button>
      <p id="intro-error" class="error" role="alert"></p>
      <p class="privacy-tip"><svg class="icon" aria-hidden="true"><use href="icons.svg#shield-check-linear" /></svg><span data-i18n="note2"></span></p>
    </section>

    <section id="task" class="card" hidden>
      <div class="task-head">
        <span id="kind-badge" class="badge"></span>
        <span id="ref" class="ref"></span>
      </div>
      <p id="instruction" class="instruction" tabindex="-1"></p>
      <div id="text" class="quran" dir="rtl" lang="ar"></div>
      <div class="dock">
      <div class="recorder">
        <button id="rec" class="rec"><svg class="icon mic-icon" aria-hidden="true"><use href="icons.svg#microphone-3-linear" /></svg><svg class="icon stop-icon" aria-hidden="true"><use href="icons.svg#stop-bold" /></svg></button>
        <div class="rec-meta">
          <span id="rec-status" role="status"></span>
          <span id="timer" class="timer">0:00</span>
        </div>
      </div>

      <div id="review" hidden>
        <audio id="playback" controls></audio>
        <label class="check"><input type="checkbox" id="followed" /> <span id="followed-label"></span></label>
        <label class="check"><input type="checkbox" id="extra" /> <span id="extra-label"></span></label>
        <div class="actions">
          <button id="redo"><svg class="icon" aria-hidden="true"><use href="icons.svg#restart-linear" /></svg><span data-i18n="redo"></span></button>
          <button id="submit" class="primary" disabled><span data-i18n="submit"></span><svg class="icon directional" aria-hidden="true"><use href="icons.svg#arrow-right-linear" /></svg></button>
        </div>
      </div>
      </div>

      <div class="footer-actions">
        <button id="skip" class="link" data-i18n="skip"></button>
        <span id="count" class="count" role="status"></span>
      </div>
      <p id="error" class="error" role="alert"></p>
      <button id="finish" class="finish" data-i18n="finish" hidden></button>
    </section>

    <section id="done" class="card" hidden>
      <div class="thank-you"><svg class="icon" aria-hidden="true"><use href="icons.svg#heart-linear" /></svg></div><h2 id="done-title" tabindex="-1"></h2>
      <p class="done-body" data-i18n="doneBody"></p>
      <form id="subscribe" class="subscribe">
        <label for="email" data-i18n="emailLabel"></label>
        <div class="subscribe-row">
          <input id="email" type="email" autocomplete="email" inputmode="email" dir="ltr" required />
          <button class="primary" type="submit" data-i18n="emailSubmit"></button>
        </div>
        <p class="fine" data-i18n="emailFine"></p>
      </form>
      <p id="subscribed" class="subscribed" data-i18n="emailThanks" hidden></p>
      <p id="sub-error" class="error" role="alert"></p>
      <button id="more" class="link" data-i18n="more"></button>
    </section>

    <footer>
      <p data-i18n-html="footer"></p>
    </footer>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
